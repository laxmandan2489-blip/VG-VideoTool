name: ▶️ Publish Video to YouTube (Unlisted — ~1 min)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct MP4 URL"
        required: true
        type: string
      title:
        description: "Video Title"
        required: true
        type: string
      description:
        description: "Video Description"
        required: false
        default: ""
        type: string
      tags:
        description: "Comma-separated tags"
        required: false
        default: ""
        type: string
      mode:
        description: "SHORT or LONG"
        required: false
        default: "SHORT"
        type: string
      category:
        description: "Script category"
        required: false
        default: "general"
        type: string

jobs:
  youtube-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install -q requests

      - name: Upload to YouTube (Unlisted)
        env:
          PUB_VIDEO_URL: ${{ inputs.video_url }}
          PUB_TITLE: ${{ inputs.title }}
          PUB_DESCRIPTION: ${{ inputs.description }}
          PUB_TAGS: ${{ inputs.tags }}
          PUB_MODE: ${{ inputs.mode }}
          PUB_CATEGORY: ${{ inputs.category }}
          YT_PRIVACY: "unlisted"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python app/yt_publish.py
