name: 🎬 Make Video (Online Cloud - Fast)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Apni Hindi/Hinglish script yahan paste karo"
        required: true
        type: string
      mode:
        description: "Video Type"
        required: true
        default: "SHORT"
        type: choice
        options:
          - SHORT
          - LONG

jobs:
  render-video:
    runs-on: ubuntu-latest
    # v5.1: GitHub Models (FREE GPT-4.1 vision) – visual jaanch ke liye, Gemini limit se alag
    permissions:
      contents: read
      actions: read
      models: read
    timeout-minutes: 100
    steps:
      - name: 0. Disk khali karo (No space left error kabhi na aaye)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: 1. Download VideoTool Code
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11 & Node.js 20
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 2b. Deno (yt-dlp ko YouTube ke liye JavaScript runtime chahiye)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 3. Cache Whisper, HuggingFace & Remotion Studio
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
            remotion_studio/node_modules
            ai_aankh
          key: vg-cloud-v3-${{ hashFiles('remotion_studio/package.json') }}
          restore-keys: |
            vg-cloud-v3-
            vg-cloud-v2-

      - name: 4. Install FFmpeg, Headless Display (xvfb) & Hindi Fonts (Fast — No Blender/rclone)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libgl1 libegl1 libxi6 libxrender1 fonts-noto-core fonts-noto-extra

      - name: 5. Install Python Packages & Remotion Dependencies (Fast — No openai-whisper)
        run: |
          pip install -q -r app/requirements.txt
          pip install -q -U "yt-dlp[default]"
          if [ -f remotion_studio/package.json ] && [ ! -d remotion_studio/node_modules ]; then
            cd remotion_studio && npm install --no-audit --no-fund && cd ..
          fi

      - name: 6. Render Video & Send to Telegram
        env:
          INPUT_SCRIPT: ${{ inputs.script }}
          INPUT_MODE: ${{ inputs.mode }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          BRAVE_KEY: ${{ secrets.BRAVE_KEY }}
          VG_HARD_LIMIT_MIN: "90"
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: xvfb-run -a -s "-screen 0 1280x720x24" python cloud_run.py

      - name: 7. Save Video Artifact (7 days backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: |
            cloud_output.mp4
            log.txt
            output/*_VISUAL_REPORT.*
          if-no-files-found: ignore
          retention-days: 7

      - name: 8. Fail / atak gaya to Telegram par batao
        if: failure() || cancelled()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f temp/cloud_jobs/tg_notified ]; then
            MSG="❌ Cloud video job fail / band ho gayi (install ya time-limit). Log yahan: $RUN_URL  – ye link ya screenshot Claude/Gemini ko bhejo."
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT_ID}" --data-urlencode text="$MSG" > /dev/null || true
            if [ -f log.txt ]; then
              tail -c 300000 log.txt > fail_log.txt
              curl -s -F chat_id="${TG_CHAT_ID}" -F document=@fail_log.txt -F caption="📋 log file" "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" > /dev/null || true
            fi
          fi
