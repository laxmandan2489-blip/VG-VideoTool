<!doctype html>
<html><head><meta charset="utf-8">
<!-- v3.6 VG HOOK TITLE (HyperFrames): shuru ke ~2.4 sec, transparent – footage ke upar, captions se door -->
<style>
  @font-face{font-family:'VGPop';src:url('Poppins-ExtraBold.ttf')}
  html,body{margin:0;background:transparent;width:1080px;height:1920px;overflow:hidden}
  #root{position:relative;width:1080px;height:1920px;font-family:'VGPop','Arial Black',sans-serif}
  .wrap{position:absolute;left:60px;right:60px;top:170px;text-align:center}
  .tag{display:inline-block;background:#FFD40A;color:#111;font-size:44px;padding:6px 26px 4px;border-radius:10px;
       letter-spacing:2px;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .l2{display:block;color:#fff;line-height:1.06;margin-top:26px;text-shadow:0 6px 0 rgba(0,0,0,.55),0 12px 34px rgba(0,0,0,.8)}
  .word{display:inline-block;margin:0 12px;will-change:transform,opacity}
  .hl{color:#FFD40A}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.4" data-width="1080" data-height="1920"
     data-composition-variables='{"line1":{"type":"string","default":"FACT"},"line2":{"type":"string","default":"Asli Raaz"},"hl":{"type":"string","default":""}}'>
  <div class="wrap clip" data-start="0" data-duration="2.4" data-track-index="0">
    <span class="tag" id="tag"></span><span class="l2" id="l2"></span>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
  const v=(window.__hyperframes&&window.__hyperframes.getVariables)?window.__hyperframes.getVariables():{};
  const esc=t=>(t||'').replace(/[<>&"]/g,'');
  const hl=(v.hl||'').toLowerCase().split(/\s+/).filter(Boolean);
  document.getElementById('tag').textContent=esc(v.line1||'FACT');
  const words=esc(v.line2||'Asli Raaz').split(/\s+/).filter(Boolean);
  const l2=document.getElementById('l2');
  l2.innerHTML=words.map(w=>'<span class="word'+(hl.includes(w.toLowerCase().replace(/[^\w%]/g,''))||/\d/.test(w)?' hl':'')+'">'+w+'</span>').join('');
  let fs=124; l2.style.fontSize=fs+'px';
  while((l2.scrollHeight>3*fs*1.1||l2.scrollWidth>960)&&fs>64){fs-=4;l2.style.fontSize=fs+'px';}
  const tl=gsap.timeline({paused:true});
  tl.from('#tag',{scale:0,rotation:-8,duration:0.32,ease:'back.out(2.5)'},0)
    .from('#l2 .word',{y:110,opacity:0,scale:1.5,duration:0.36,stagger:0.06,ease:'back.out(2)'},0.12)
    .to('#l2 .hl',{scale:1.12,duration:0.18,yoyo:true,repeat:1,ease:'sine.inOut'},0.95)
    .to('.wrap',{y:-60,opacity:0,duration:0.28,ease:'power2.in'},2.08);
  window.__timelines=window.__timelines||{}; window.__timelines["main"]=tl; tl.seek(0);
</script>
</body></html>
